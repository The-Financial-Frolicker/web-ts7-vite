name: Edge acceptance

# Deployed-edge behavioural acceptance: deploy the application to a disposable
# Cloudflare Worker, verify in a real browser that the deployed page renders and
# the WebAssembly calculation produced the expected output, and keep the evidence.
#
# Deliberately not wired to push or pull_request: it deploys, so it needs
# privileged credentials, and the suite is an explicit, human-initiated assurance
# step. Trigger it from the Actions UI or with:
#   gh workflow run edge-acceptance.yml -f confirm=accept
#
# Never production: the Worker name is `edge-<run_id>-<attempt>`, a throwaway
# instance that is deleted at the end of the run.
#
# Run isolation. Two dispatches may overlap — a human testing deployment and
# teardown races will do exactly that — and nothing here depends on a global
# lock:
#
#   * the Worker name is derived from `github.run_id` and `github.run_attempt`,
#     so no two runs (or re-runs) can address the same deployment;
#   * each run works in its own `${{ runner.temp }}/acceptance-<run>-<attempt>`
#     tree, outside the checkout it is copied from, so the build, the evidence
#     and the deployment metadata never cross runs — and the archive can never
#     contain its own destination;
#   * the artefact name is equally run-scoped, so evidence cannot be overwritten;
#   * cleanup deletes `"$WORKER_NAME"` and nothing else.
#
# The `concurrency` group below is per ref with `cancel-in-progress: false`, so a
# second dispatch of *this* workflow on the same ref is queued rather than
# cancelled mid-teardown. That scheduling choice is not what makes concurrent
# runs safe; the run-scoped identities above are, and
# `scripts/edge-readiness.test.mjs` asserts them.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "accept" to deploy a disposable Worker and run edge acceptance'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: edge-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_YES: "1"
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  edge-acceptance:
    name: Edge acceptance (ubuntu-24.04)
    if: ${{ inputs.confirm == 'accept' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Add this job to a protected environment once one exists in the repository:
    #   environment: cloudflare-edge-acceptance
    # Referencing a non-existent environment would create an unprotected one, so
    # the explicit dispatch plus confirmation input is the gate for now.

    env:
      # Disposable, non-production identity. Never a shared staging Worker.
      WORKER_NAME: edge-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The disposable tree lives in the runner's temporary directory, never
      # inside `${{ github.workspace }}`: the prepare step archives the checkout
      # into this directory, and a destination inside its own source makes the
      # producing tar read a directory the extracting tar is still filling
      # (`tar: ./.acceptance: file changed as we read it`). The name stays
      # run-scoped, so overlapping runs and re-runs cannot share a tree.
      WORK_DIR: ${{ runner.temp }}/acceptance-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain with mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_save_post: true
          install: true

      - name: Install Node for the Wrangler deployment
        # The build runs on Deno; the real deployment path is Node-hosted because
        # Wrangler is a Node tool (see README "Runtime ownership"). Node is not a
        # project-managed tool, so Actions provides it.
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: mise exec -- deno task toolchain:install -- --allow-download

      - name: Require Cloudflare credentials
        # Fail closed with the actual prerequisite: a skipped acceptance run is
        # not an accepted deployment.
        run: |
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::edge acceptance needs:$missing"
            echo "Configure the repository secret CLOUDFLARE_API_TOKEN (Workers"
            echo "Scripts:Edit on the acceptance account) and the repository variable"
            echo "CLOUDFLARE_ACCOUNT_ID, then re-run this workflow."
            exit 1
          fi
          echo "Cloudflare credentials present (values are never printed)."

      - name: Prepare a disposable deployment tree
        # The template's placeholder is not a valid Worker name, so the same
        # throwaway-copy idiom as scripts/ci.sh applies: initialise a unique
        # identity and never touch the checked-out tree.
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          tar -C "$GITHUB_WORKSPACE" \
            --exclude=./.git \
            --exclude=./node_modules \
            --exclude=./dist \
            --exclude=./build-wasm \
            --exclude=./.wrangler \
            --exclude=./public/wasm \
            --exclude=./artifacts \
            --exclude='./.aider*' \
            -cf - . | tar -C "$WORK_DIR" -xf -
          ln -s "$GITHUB_WORKSPACE/node_modules" "$WORK_DIR/node_modules"
          cd "$WORK_DIR"
          mise exec -- deno task init:project "$WORKER_NAME"

      - name: Build and deploy the disposable Worker
        id: deploy
        # `deno task deploy` builds, checks the deployment artefacts and runs the
        # Node-hosted Wrangler deployment. Vite's build needs the explicit CI
        # profile on a hosted runner (denoland/deno#37062).
        #
        # BUILD_SHA and BUILD_DEPLOYMENT are compiled into the page, so the
        # browser verifier can prove it observed *this* revision and *this*
        # deployment instance. They are passed to the build, never guessed.
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          cd "$WORK_DIR"
          # The deployment identity is the generated configuration's Worker name.
          # `init:project "$WORKER_NAME"` above wrote it into wrangler.jsonc, the
          # build emits dist/worker/wrangler.json with that same name, and
          # `check:deploy` verifies it — one name, carried by the configuration.
          # The task is therefore invoked with no Wrangler arguments: the
          # launcher's default invocation is `deploy --config <generated>`, and
          # any non-empty argument list would replace that command instead of
          # adding to it.
          export BUILD_DEPLOYMENT="$WORKER_NAME"
          set +e
          VITE_PERMISSION_PROFILE=ci-runner mise exec -- deno task deploy 2>&1 | tee "$WORK_DIR/deploy.log"
          status=${PIPESTATUS[0]}
          echo "deploy_exit=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Edge acceptance (real browser, real deployment)
        if: ${{ steps.deploy.outputs.deploy_exit == '0' }}
        env:
          DEPLOY_EXIT_CODE: "0"
          # Readiness budgets. The gate polls the published URL every two seconds
          # for up to thirty: Wrangler reports success before the workers.dev
          # route serves the version, and Cloudflare answers with its own error
          # page (error 1042) or a transient 5xx until it does.
          EDGE_READINESS_TIMEOUT_MS: "30000"
          EDGE_READINESS_INTERVAL: "2"
        run: |
          cd "$WORK_DIR"
          # The deployment log belongs to this run's tree; deriving it here keeps
          # `WORK_DIR` the single place the acceptance paths are declared.
          export DEPLOY_LOG="$WORK_DIR/deploy.log"
          mise exec -- bash scripts/edge-accept.sh

      - name: Delete the disposable Worker and verify it is gone
        id: cleanup
        if: always()
        # Cleanup deletes exactly the Worker this run deployed, then verifies its
        # absence with an independent API read. It does not use `wrangler delete`:
        # that command deletes the Worker and *then* runs a legacy KV-namespace
        # post-check which, under a Workers Scripts:Edit token, fails with
        # Cloudflare error 10000 (401). Wrangler tolerates only a 403 there, so it
        # exits non-zero after a deletion that already succeeded, and the run
        # reported a failure for cleanup that had worked.
        #
        # The script needs only the disposable name, the account id and the token.
        # It never lists or enumerates Workers, never names another Worker, and
        # never needs KV permissions, so the token does not have to be widened.
        #
        # Its exit status is the cleanup verdict: it is recorded in the `cleanup`
        # step outcome, in the step outputs, in the job summary and in
        # cleanup.json. `continue-on-error` keeps that verdict explicit without
        # letting an operational cleanup problem change the application's
        # acceptance verdict, which is decided by the evidence above and is not
        # touched here.
        continue-on-error: true
        env:
          # Exactly the two credentials cleanup needs, and nothing else.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$WORK_DIR/artifacts"

          set +e
          bash scripts/edge-cleanup.sh \
            --worker "$WORKER_NAME" \
            --out "$WORK_DIR/artifacts" \
            --evidence "$WORK_DIR/artifacts/acceptance.json"
          status=$?
          set -e

          classification="unknown"
          if [ -f "$WORK_DIR/artifacts/cleanup.json" ]; then
            classification="$(python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1])).get("classification", "unknown"))' \
              "$WORK_DIR/artifacts/cleanup.json" 2>/dev/null || echo unknown)"
          fi
          echo "cleanup_exit=$status" >> "$GITHUB_OUTPUT"
          echo "cleanup_classification=$classification" >> "$GITHUB_OUTPUT"

          {
            echo "### Disposable Worker cleanup"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Worker | \`$WORKER_NAME\` |"
            echo "| Result | \`$classification\` (exit $status) |"
            echo "| Evidence | \`artifacts/cleanup.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::warning::cleanup of $WORKER_NAME did not verify ($classification, exit $status); see cleanup.json. The acceptance verdict is unaffected."
          fi
          exit "$status"

      # The evidence is uploaded *after* cleanup so the artefact contains the
      # cleanup outcome too. Uploading earlier captured acceptance.json before
      # the cleanup record had been merged into it, so a run could look cleaner
      # than it was.
      - name: Keep the acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORK_DIR }}/artifacts/acceptance.json
            ${{ env.WORK_DIR }}/artifacts/edge-readiness.json
            ${{ env.WORK_DIR }}/artifacts/screenshot.png
            ${{ env.WORK_DIR }}/artifacts/page.html
            ${{ env.WORK_DIR }}/artifacts/cleanup.json
            ${{ env.WORK_DIR }}/deploy.log
          if-no-files-found: warn
          retention-days: 30
