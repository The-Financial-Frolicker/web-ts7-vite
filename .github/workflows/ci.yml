name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow only validates the repository. It never deploys and needs no
# secrets, so the token is read-only.
permissions:
  contents: read

# A newer run for the same branch supersedes an in-progress one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the pinned toolchain install non-interactive.
  MISE_YES: "1"
  # Deno's update check adds noise and is pointless on a pinned toolchain.
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Repository-role discriminator: the generator owns `toolchain/deno.lock`.
  # A generated product never ships it, so exactly one of these jobs can run.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (generator)
    if: hashFiles('toolchain/deno.lock') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The workflow only reads the repository.
          persist-credentials: false

      - name: Install the pinned toolchain with mise
        uses: jdx/mise-action@v5
        with:
          # Installs every tool pinned in .mise.toml at its exact version,
          # including the Emscripten SDK. The action caches mise's data
          # directory (installs and downloads) under a key derived from
          # .mise.toml, so the ~1.7 GB emsdk download is reused across runs.
          # Saving in the post step also captures Emscripten's compiler cache,
          # which is generated inside the SDK during the build.
          cache: true
          cache_save_post: true
          install: true

      - name: Verify the pinned toolchain
        run: |
          mise exec -- deno --version
          mise exec -- cmake --version | head -n 1
          mise exec -- ninja --version
          mise exec -- emcc --version | head -n 1

      # Toolchain conformance, not preparation: every pin is resolved, the
      # installed versions are compared with `toolchain.toml`, and `.mise.toml`
      # is checked against its projection. Nothing is installed here — mise
      # already installed the pins in the step above, and `--check` never
      # modifies tools. Generator-only: a product does not manage its toolchain.
      - name: Toolchain conformance (generator only)
        if: hashFiles('scripts/toolchain-prepare.mjs') != ''
        run: mise exec -- deno task toolchain:prepare -- --check

      - name: Resolve the Python interpreter for Emscripten
        # Same resolution the build uses: an explicit EMSDK_PYTHON, then the
        # runner's python3 when it satisfies Emscripten's minimum, and only
        # then a mise-provisioned fallback.
        run: bash scripts/resolve-python.sh

      # The toolchain is provisioned through the same generator-owned lifecycle a
      # developer runs. `--frozen` keeps resolution locked (nothing is discovered,
      # upgraded or re-pinned); `--allow-download` exists only because a clean
      # runner has no Deno package cache. The materialisation is verified and its
      # identity recorded before any application workflow runs.
      - name: Provision the toolchain
        if: hashFiles('scripts/toolchain-install.mjs') != ''
        run: mise exec -- deno task toolchain:install -- --allow-download

      - name: Record and verify the toolchain identity
        run: |
          set -euo pipefail
          tc="${XDG_DATA_HOME:-$HOME/.local/share}/web-ts7-vite/toolchain"
          echo "::group::toolchain identity"
          cat "$tc/toolchain.json"
          sha256sum "$tc/package.json" "$tc/deno.json" "$tc/deno.lock"
          echo "::endgroup::"
          for pkg in vite wrangler typescript @cloudflare/vite-plugin; do
            test -e "$tc/node_modules/$pkg" || { echo "missing package: $pkg"; exit 1; }
          done
          test -x "$tc"/node_modules/.deno/@cloudflare+workerd-linux-64@*/node_modules/@cloudflare/workerd-linux-64/bin/workerd
          test -x "$tc"/node_modules/.deno/@rolldown+binding-linux-x64-gnu@*/node_modules/@rolldown/binding-linux-x64-gnu/*.node
          echo "toolchain identity verified"
        run: mise exec -- deno task fmt:check

      - name: Lint check
        run: mise exec -- deno task lint

      - name: Client typecheck
        run: mise exec -- deno task check:client

      - name: Worker typecheck
        run: mise exec -- deno task check:worker

      # Generator-only suite: the initialiser is not shipped in a product, so the
      # guard keeps this workflow valid in both trees.
      - name: Project initialisation tests (generator only)
        if: hashFiles('scripts/init-project.test.mjs') != ''
        run: mise exec -- deno task test:init

      # Invokes the Worker handler directly with standard `Request` objects;
      # no server, network access or bindings are involved.
      - name: Worker runtime tests
        run: mise exec -- deno task test:worker

      # Rejects Node built-in imports and Node runtime globals in the delivered
      # application source (`src/`, `worker/`). The development toolchain is out
      # of scope; see "Node.js dependency boundary" in README.md.
      - name: Node dependency boundary (source)
        run: mise exec -- deno task check:node-boundary

      - name: Node dependency boundary tests
        run: mise exec -- deno task test:boundary

      # Generator-only suite: the discovery primitives' test is not shipped in a
      # product, so the guard keeps this workflow valid in both trees.
      - name: Toolchain discovery tests (generator only)
        if: hashFiles('scripts/toolchain.test.mjs') != ''
        run: mise exec -- deno task test:toolchain

      # Contract lifecycle: fingerprints, provenance, approval and verification
      # logic. Synthetic fixtures only — no workerd, no Vite.
      - name: Contract lifecycle tests
        run: mise exec -- deno task test:contracts

      # Remaining generator-only suites. Their sources and tasks are not part of a
      # generated product, so each step is guarded by the presence of its test
      # file (the same pattern as the two generator-only steps above): this
      # workflow runs unchanged in both trees and never invokes a task that a
      # product does not define.
      - name: Toolchain configuration tests (generator only)
        if: hashFiles('scripts/toolchain-config.test.mjs') != ''
        run: mise exec -- deno task test:toolchain-config

      - name: Generator regression suite (generator only)
        if: hashFiles('scripts/generate-product.test.mjs') != ''
        run: mise exec -- deno task test:generator

      # Release provenance is constructed by the generator: clean tree, annotated
      # release tag, tag/commit equality. The suite needs git and the generator's
      # own digest implementation, neither of which a product receives.
      - name: Release provenance tests (generator only)
        if: hashFiles('scripts/provenance.test.mjs') != ''
        run: mise exec -- deno task test:provenance

      # The shipped reader/verifier and the workflow it feeds. These run in the
      # generator and, unchanged, in every product.
      - name: Product provenance reader and verifier tests
        run: mise exec -- deno task test:provenance-source

      - name: Provenance output-boundary tests
        run: mise exec -- deno task test:github-output

      - name: CI workflow contract tests
        run: mise exec -- deno task test:ci-workflow

      - name: Vite invocation tests
        run: mise exec -- deno task test:vite

      - name: Wrangler type-generation tests
        run: mise exec -- deno task test:wrangler-types

      - name: Wrangler dry-run tests
        run: mise exec -- deno task test:wrangler-dry-run

      - name: Node-exclusion wrapper tests
        run: mise exec -- deno task test:no-node

      # Generator-only: the deployed-edge acceptance logic is not part of a
      # generated product, so the guard keeps this workflow valid in both trees.
      # These are the pure decision-logic tests; the real deployment is exercised
      # only by .github/workflows/edge-acceptance.yml.
      - name: Edge acceptance logic tests (generator only)
        if: hashFiles('scripts/edge-verify.test.mjs') != ''
        run: mise exec -- deno task test:edge

      # The strict contract gate is the LAST step of this job: every independent
      # suite above runs before the verdict, so a bootstrap baseline cannot hide
      # them. It remains fatal. This step performs no discovery — it reads
      # toolchain-contracts.json, recomputes the fingerprint from the installed
      # packages, and fails unless an approved contract matches. A toolchain
      # change that alters a fingerprint requires a new local discovery and
      # approval cycle; CI never generates or approves a contract.
      - name: Toolchain contracts (consume, do not discover)
        run: mise exec -- deno task check:contracts

  # Build validation is a separate job so that a rejected contract in the static
  # job cannot hide it. `needs` only orders the jobs; `!cancelled()` makes this
  # job run whether `validate` passed or failed, and the workflow as a whole
  # still fails whenever either job fails — the strict gate above is never
  # downgraded. `scripts/ci.sh build` performs the same throwaway-copy
  # initialisation and runs the contract gate again as its final step, after the
  # build, so the generated configuration is compared with build output present.
  build:
    name: Build validation (generator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate
    if: ${{ !cancelled() && hashFiles('toolchain/deno.lock') != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain with mise
        uses: jdx/mise-action@v5
        with:
          # Same pins and cache keys as the validate job; a second runner needs
          # its own restore (GitHub saves a key once and reports the duplicate
          # save from the other job without failing).
          cache: true
          cache_save_post: true
          install: true

      # A second runner needs its own installation; there is no shared cache.
      - name: Provision the toolchain
        if: hashFiles('scripts/toolchain-install.mjs') != ''
        run: mise exec -- deno task toolchain:install -- --allow-download

      # The template's identity placeholder is not a valid Cloudflare Worker
      # name, so this stage builds a throwaway initialised copy: worker types
      # freshness check, WASM build, build-tree and published-artifact smoke
      # tests, and `wrangler deploy --dry-run`. Emscripten's Python interpreter
      # is resolved inside the build itself (scripts/resolve-python.sh), so no
      # separate diagnostic step is duplicated here. It never deploys.
      - name: Generated types, WASM build, smoke tests, deployment dry run and contract gate
        run: mise exec -- bash scripts/ci.sh build

      # The generated product must stand on its own: produced into the runner's
      # temporary directory, then exercised with its own cwd and without any
      # generator path in play. This is the CI form of the S6-E independence test.
      - name: Generated product independence
        if: hashFiles('scripts/product-manifest.mjs') != ''
        run: |
          set -euo pipefail
          product="${RUNNER_TEMP}/ci-product"
          rm -rf "$product"
          mise exec -- deno task product:generate ci-product --into "$product"
          # Ownership assertions on the product tree.
          test ! -d "$product/toolchain"
          test ! -e "$product/deno.lock"
          test -f "$product/scripts/tsc-check.mjs"
          test -f "$product/scripts/tsc-check.sh"
          test ! -f "$product/scripts/vite-runner.mjs"
          test ! -f "$product/scripts/toolchain-install.mjs"
          if grep -q '"toolchain:install"' "$product/deno.json"; then
            echo "generator-only task leaked into the product"; exit 1
          fi
          cd "$product"
          echo "::group::product identity"
          cat package.json
          echo "::endgroup::"
          mise exec -- deno task check:client
          mise exec -- deno task check:worker
          mise exec -- deno task build
          mise exec -- deno task deploy:dry-run
          echo "generated product validated independently"

  # ---------------------------------------------------------------------------
  # Generated product path.
  #
  # A generated product ships no `toolchain/` directory, which is the role
  # discriminator. It must therefore establish *which* generator release and
  # *which* materialised dependency tree it is authorised to use before any
  # product task runs. A product with missing or invalid provenance fails in
  # Stage A; it can never fall through into the generator jobs.
  # ---------------------------------------------------------------------------
  product:
    name: Product validation (release provenance required)
    if: hashFiles('toolchain/deno.lock') == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # External to the product checkout: the installation is CI infrastructure.
      TOOLCHAIN_ROOT: ${{ runner.temp }}/toolchain

    steps:
      - name: Check out product
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned host tools with mise
        uses: jdx/mise-action@v5
        with:
          # The product's own projection; binaries only. The npm-domain
          # toolchain is provisioned separately and is never cached here.
          cache: true
          cache_save_post: true
          install: true

      # Stage A — provenance metadata. Nothing else may run before this passes.
      # The reader validates the schema, the fixed repository identity, the
      # toolchain-YYYY.MM.N ref and both digest formats *before* it writes
      # anything, so a rejected record leaves no partial output for later steps.
      - name: Read and validate provenance metadata
        id: meta
        run: |
          set -euo pipefail
          deno run --allow-read --allow-env scripts/toolchain-source.mjs \
            read --format=github | tee -a "$GITHUB_OUTPUT"

      # Stage B — the fixed generator release, nothing movable.
      - name: Check out the recorded generator release
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.tc_repository }}
          ref: ${{ steps.meta.outputs.tc_ref }}
          path: ${{ runner.temp }}/generator
          persist-credentials: false

      - name: Verify the generator release identity
        run: |
          set -euo pipefail
          generator="${{ runner.temp }}/generator"
          expected="${{ steps.meta.outputs.tc_sha }}"
          ref="${{ steps.meta.outputs.tc_ref }}"
          actual="$(git -C "$generator" rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "checked-out generator is $actual; the product expects $expected"; exit 1; }
          kind="$(git -C "$generator" cat-file -t "refs/tags/$ref")"
          test "$kind" = "tag" || {
            echo "release ref is a $kind, not an annotated tag"; exit 1; }
          resolved="$(git -C "$generator" rev-parse "$ref^{commit}")"
          test "$resolved" = "$expected" || {
            echo "release tag resolves to $resolved, not $expected"; exit 1; }
          echo "generator release verified: $ref -> $expected"

      # Stage C — provisioning, from the verified checkout, outside the product.
      # The execution context is declared, not implied: this step runs *in* the
      # generator checkout, which is what authorises a generator-only task.
      - name: Provision the toolchain from the verified generator release
        working-directory: ${{ runner.temp }}/generator
        run: |
          set -euo pipefail
          mise exec -- deno task toolchain:install -- --allow-download

      # Stage D — the three identities must agree, with the digest computed by
      # the verified checkout's own implementation.
      - name: Verify provenance and materialisation
        run: |
          set -euo pipefail
          deno run --allow-read --allow-env \
            "$GITHUB_WORKSPACE/scripts/toolchain-source.mjs" verify \
            --generator "${{ runner.temp }}/generator" \
            --toolchain-root "$TOOLCHAIN_ROOT"

      # Stage E — product acceptance, only after every gate above.
      - name: Client typecheck
        run: mise exec -- deno task check:client

      - name: Worker typecheck
        run: mise exec -- deno task check:worker

      - name: Build
        run: mise exec -- deno task build

      - name: Wrangler deploy dry run
        run: mise exec -- deno task deploy:dry-run
