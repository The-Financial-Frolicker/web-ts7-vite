# Authoritative toolchain configuration for this template.
#
# This file is the single source of desired tool versions. `.mise.toml` is a
# projection generated from it (see `deno task toolchain:prepare`) and must not
# be edited independently.
#
# Version semantics:
#   "1.2.3"  an exact version; it must exist in the relevant mise backend
#   "latest" resolve to the newest available version at preparation time
#   omitted  equivalent to "latest"
#
# Supported tools are the ones this template actually manages: deno, cmake,
# ninja and emsdk. Node and Python are deliberately not project-managed; see
# README.md ("Install the toolchain and dependencies").
#
# The shipped values are exact so that generating a template is reproducible.
# A future toolchain scanner can rewrite this file with the versions it observed
# without knowing anything about template generation.

[tools]
deno = "2.9.8"
# Emscripten 6.0.13 warns for cmake 4.2.0-4.3.3; wasm/CMakeLists.txt needs >= 4.2.
cmake = "4.4.5"
ninja = "1.13.2"
emsdk = "6.0.13"
